name: links
on:
  push:
    paths: ["**.md"]
  pull_request:
    paths: ["**.md"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-concurrency 8 --timeout 30 --max-retries 2
            --accept 200,206,403,429,999
            --exclude-path node_modules
            './**/*.md'
          fail: ${{ github.event_name != 'schedule' }}
