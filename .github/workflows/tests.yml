name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  labs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 run_tests.py
      - name: Run every lab end to end
        run: |
          for lab in labs/*/run.py; do echo "::group::$lab"; python3 "$lab"; echo "::endgroup::"; done
          python3 examples/mcp/scan_tools.py examples/mcp/sample_tools.json || test $? -eq 1
