<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="t d">
  <title id="t">A fully guarded AI agent</title>
  <desc id="d">A user request passes an input guardrail (PII, jailbreak, prompt injection), then reaches a LangGraph or n8n agent whose tool calls and tool results each pass an MCP guardrail, then an output guardrail (privacy, safety, compliance), giving a validated response. Every guardrail can allow, mask, send for human review, or block.</desc>
  <style>
    .bg{fill:#ffffff}.card{fill:#fafaf9;stroke:#e7e5e4}.guard{fill:#fff7ed;stroke:#ea580c}.tool{fill:#ffffff;stroke:#d6d3d1}
    .h{font:600 17px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#1c1917}
    .s{font:400 13px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#57534e}
    .tag{font:600 11px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#ea580c;letter-spacing:.06em}
    .foot{font:400 12px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#78716c}
    .arrow{stroke:#a8a29e;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .pill{fill:#f5f5f4}.pt{font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}.card{fill:#161b22;stroke:#30363d}.guard{fill:#2a1709;stroke:#f97316}.tool{fill:#0d1117;stroke:#30363d}
      .h{fill:#e6edf3}.s{fill:#9da7b3}.foot{fill:#8b949e}.tag{fill:#fb923c}.arrow{stroke:#6e7681}.pill{fill:#21262d}
    }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a8a29e"/></marker></defs>
  <rect class="bg" width="760" height="560" rx="14"/>
  <rect class="card" x="12" y="12" width="736" height="536" rx="14"/>

  <text class="h" x="380" y="52" text-anchor="middle">User request</text>
  <path class="arrow" d="M380 62v22"/>

  <rect class="guard" x="140" y="88" width="480" height="62" rx="10"/>
  <text class="tag" x="156" y="106">1</text>
  <text class="h" x="380" y="114" text-anchor="middle">Input guardrail</text>
  <text class="s" x="380" y="136" text-anchor="middle">PII · Jailbreak · Prompt injection</text>
  <path class="arrow" d="M380 150v24"/>

  <text class="h" x="380" y="196" text-anchor="middle">LangGraph / n8n / Claude agent</text>
  <text class="s" x="380" y="216" text-anchor="middle">LLM + memory + tools (MCP)</text>
  <path class="arrow" d="M300 224l-70 26"/><path class="arrow" d="M460 224l70 26"/>

  <rect class="guard" x="60" y="254" width="310" height="76" rx="10"/>
  <text class="tag" x="76" y="272">2a</text>
  <text class="h" x="215" y="282" text-anchor="middle">MCP guardrail · tool calls</text>
  <text class="s" x="215" y="304" text-anchor="middle">Allowlist · schema · destination · intent</text>
  <text class="s" x="215" y="321" text-anchor="middle">human approval for risky actions</text>

  <rect class="guard" x="390" y="254" width="310" height="76" rx="10"/>
  <text class="tag" x="406" y="272">2b</text>
  <text class="h" x="545" y="282" text-anchor="middle">MCP guardrail · tool results</text>
  <text class="s" x="545" y="304" text-anchor="middle">Indirect injection · PII in data</text>
  <text class="s" x="545" y="321" text-anchor="middle">poisoned tool definitions</text>

  <path class="arrow" d="M215 330l100 34"/><path class="arrow" d="M545 330l-100 34"/>

  <rect class="guard" x="140" y="368" width="480" height="62" rx="10"/>
  <text class="tag" x="156" y="386">3</text>
  <text class="h" x="380" y="394" text-anchor="middle">Output guardrail</text>
  <text class="s" x="380" y="416" text-anchor="middle">Privacy · Safety · Compliance · prompt-leak canary</text>
  <path class="arrow" d="M380 430v22"/>
  <text class="h" x="380" y="474" text-anchor="middle">Validated response</text>

  <g transform="translate(176 496)">
    <rect class="pill" width="92" height="24" rx="12"/><text class="pt" x="46" y="16" text-anchor="middle" fill="#16a34a">ALLOW</text>
    <rect class="pill" x="104" width="92" height="24" rx="12"/><text class="pt" x="150" y="16" text-anchor="middle" fill="#2563eb">MASK</text>
    <rect class="pill" x="208" width="92" height="24" rx="12"/><text class="pt" x="254" y="16" text-anchor="middle" fill="#d97706">REVIEW</text>
    <rect class="pill" x="312" width="92" height="24" rx="12"/><text class="pt" x="358" y="16" text-anchor="middle" fill="#dc2626">BLOCK</text>
  </g>
  <text class="foot" x="380" y="538" text-anchor="middle">Reference architecture · your code calls every guardrail, the model never decides whether to check</text>
</svg>
